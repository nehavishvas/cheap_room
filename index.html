<script type="text/javascript">
  const testDivs = document.querySelectorAll('.test-div');

  // Store individual states per input
  const states = Array.from(testDivs).map(() => ({
    rooms: 1,
    adults: 2,
    children: 0,
    childAges: []
  }));

  let activeIndex = null;

  // Initialize each input & popup pair
  testDivs.forEach((div, index) => {
    const input = div.querySelector('.input-box');
    const popup = div.querySelector('.popup');

    // Controls inside popup
    const roomMinus = popup.querySelector('.roomMinus');
    const roomPlus = popup.querySelector('.roomPlus');
    const roomsValue = popup.querySelector('.roomsValue');

    const adultMinus = popup.querySelector('.adultMinus');
    const adultPlus = popup.querySelector('.adultPlus');
    const adultsValue = popup.querySelector('.adultsValue');

    const childMinus = popup.querySelector('.childMinus');
    const childPlus = popup.querySelector('.childPlus');
    const childrenValue = popup.querySelector('.childrenValue');

    const childAgesContainer = popup.querySelector('.childAgesContainer');

    // Show popup and load state on input click
    input.addEventListener('click', e => {
      e.stopPropagation();

      // Hide all other popups
      testDivs.forEach((otherDiv, i) => {
        const otherPopup = otherDiv.querySelector('.popup');
        if (i !== index) otherPopup.style.display = 'none';
      });

      activeIndex = index;
      loadStateToPopup(states[index]);
      updateInputDisplay(index);
      showPopupNear(input, popup);
    });

    // Initialize input display text
    updateInputDisplay(index);

    // Button events
    roomMinus.onclick = () => {
      if (activeIndex !== index) return;
      const state = states[index];
      if (state.rooms > 1) {
        state.rooms--;
        roomsValue.textContent = state.rooms;
        updateInputDisplay(index);
      }
    };
    roomPlus.onclick = () => {
      if (activeIndex !== index) return;
      const state = states[index];
      state.rooms++;
      roomsValue.textContent = state.rooms;
      updateInputDisplay(index);
    };

    adultMinus.onclick = () => {
      if (activeIndex !== index) return;
      const state = states[index];
      if (state.adults > 1) {
        state.adults--;
        adultsValue.textContent = state.adults;
        updateInputDisplay(index);
      }
    };
    adultPlus.onclick = () => {
      if (activeIndex !== index) return;
      const state = states[index];
      state.adults++;
      adultsValue.textContent = state.adults;
      updateInputDisplay(index);
    };

    childMinus.onclick = () => {
      if (activeIndex !== index) return;
      const state = states[index];
      if (state.children > 0) {
        state.children--;
        state.childAges.pop();
        childrenValue.textContent = state.children;
        updateChildAgesUI(state);
        updateInputDisplay(index);
      }
    };
    childPlus.onclick = () => {
      if (activeIndex !== index) return;
      const state = states[index];
      state.children++;
      state.childAges.push(0);
      childrenValue.textContent = state.children;
      updateChildAgesUI(state);
      updateInputDisplay(index);
    };

    function loadStateToPopup(state) {
      roomsValue.textContent = state.rooms;
      adultsValue.textContent = state.adults;
      childrenValue.textContent = state.children;
      updateChildAgesUI(state);
    }

    function updateChildAgesUI(state) {
      childAgesContainer.innerHTML = '';
      if (state.children > 0) {
        for (let i = 0; i < state.children; i++) {
          const age = state.childAges[i] !== undefined ? state.childAges[i] : 0;
          const div = document.createElement('div');
          div.className = 'child-age';
          div.innerHTML = `
                  <label for="childAge${index}-${i}">Age of Child ${i + 1}:</label>
                  <select id="childAge${index}-${i}" data-index="${i}">
                    ${generateAgeOptions(age)}
                  </select>
                `;
          childAgesContainer.appendChild(div);
        }
        childAgesContainer.querySelectorAll('select').forEach(select => {
          select.addEventListener('change', e => {
            const idx = parseInt(e.target.dataset.index);
            states[index].childAges[idx] = parseInt(e.target.value);
            updateInputDisplay(index);
          });
        });
      }
    }

    function generateAgeOptions(selectedAge) {
      let options = `<option value="0" ${selectedAge === 0 ? 'selected' : ''}>&lt;1 year old</option>`;
      for (let i = 1; i <= 17; i++) {
        options += `<option value="${i}" ${selectedAge === i ? 'selected' : ''}>${i} years old</option>`;
      }
      return options;
    }

    function updateInputDisplay(idx) {
      const state = states[idx];
      const roomsText = state.rooms + (state.rooms === 1 ? ' Room' : ' Rooms');
      const adultsText = state.adults + (state.adults === 1 ? ' Adult' : ' Adults');
      const childrenText = state.children + (state.children === 1 ? ' Child' : ' Children');
      const inp = testDivs[idx].querySelector('.input-box');
      inp.value = `${roomsText}, ${adultsText}, ${childrenText}`;
    }

    function showPopupNear(input, popup) {
      const rect = input.getBoundingClientRect();
      popup.style.top = rect.bottom + window.scrollY + 5 + 'px';
      popup.style.left = rect.left + window.scrollX + 'px';
      popup.style.display = 'block';
    }
  });

  // Hide popup if clicked outside any popup or input
  document.addEventListener('click', e => {
    testDivs.forEach(div => {
      const popup = div.querySelector('.popup');
      if (!div.contains(e.target)) {
        popup.style.display = 'none';
      }
    });
  });
</script>

<script type="text/javascript">
  const minRange = document.getElementById('min-range');
  const maxRange = document.getElementById('max-range');
  const minPriceInput = document.getElementById('min-price');
  const maxPriceInput = document.getElementById('max-price');
  const sliderRange = document.getElementById('slider-range');

  const formatNumber = (num) => num.toLocaleString('en-IN');

  const updateSliderRange = () => {
    const min = parseInt(minRange.value);
    const max = parseInt(maxRange.value);
    const rangeWidth = maxRange.max - minRange.min;

    const left = ((min - minRange.min) / rangeWidth) * 100;
    const right = ((max - minRange.min) / rangeWidth) * 100;

    sliderRange.style.left = `${left}%`;
    sliderRange.style.width = `${right - left}%`;
  };

  minRange.addEventListener('input', () => {
    let minVal = parseInt(minRange.value);
    let maxVal = parseInt(maxRange.value);
    if (minVal > maxVal - 1000) {
      minVal = maxVal - 1000;
      minRange.value = minVal;
    }
    minPriceInput.value = formatNumber(minVal);
    updateSliderRange();
  });

  maxRange.addEventListener('input', () => {
    let minVal = parseInt(minRange.value);
    let maxVal = parseInt(maxRange.value);
    if (maxVal < minVal + 1000) {
      maxVal = minVal + 1000;
      maxRange.value = maxVal;
    }
    maxPriceInput.value = formatNumber(maxVal);
    updateSliderRange();
  });

  minPriceInput.addEventListener('change', () => {
    let val = parseInt(minPriceInput.value.replace(/,/g, '')) || 0;
    val = Math.max(0, Math.min(val, parseInt(maxRange.value) - 1000));
    minRange.value = val;
    minPriceInput.value = formatNumber(val);
    updateSliderRange();
  });

  maxPriceInput.addEventListener('change', () => {
    let val = parseInt(maxPriceInput.value.replace(/,/g, '')) || 0;
    val = Math.max(parseInt(minRange.value) + 1000, Math.min(val, 119970));
    maxRange.value = val;
    maxPriceInput.value = formatNumber(val);
    updateSliderRange();
  });

  // Initialize on load
  window.addEventListener('DOMContentLoaded', updateSliderRange); 
</script>

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", () => {
    const dropdownBtn = document.getElementById("sortDropdownBtn");
    const dropdownList = document.getElementById("sortOptionsList");

    dropdownBtn.addEventListener("click", () => {
      const expanded = dropdownBtn.getAttribute("aria-expanded") === "true";
      dropdownBtn.setAttribute("aria-expanded", !expanded);
      dropdownList.classList.toggle("hidden");
    });

    // Option click
    dropdownList.addEventListener("click", (e) => {
      if (e.target.tagName === "LI") {
        const selectedText = e.target.textContent;
        const selectedSort = e.target.dataset.sort;

        dropdownBtn.querySelector(".sort-label").textContent = `Sort by: ${selectedText}`;
        dropdownBtn.setAttribute("data-selected-sorter", selectedSort);

        // Close dropdown
        dropdownBtn.setAttribute("aria-expanded", "false");
        dropdownList.classList.add("hidden");
      }
    });

    // Optional: click outside to close
    document.addEventListener("click", (e) => {
      if (!dropdownBtn.contains(e.target) && !dropdownList.contains(e.target)) {
        dropdownBtn.setAttribute("aria-expanded", "false");
        dropdownList.classList.add("hidden");
      }
    });
  }); 
</script>
